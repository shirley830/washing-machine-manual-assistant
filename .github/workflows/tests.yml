name: Project checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run retrieval and answer checks
        run: |
          python evaluation/run_smoke_retrieval.py
          python evaluation/run_smoke_answering.py
          python evaluation/run_formal_evaluation.py
          python -m unittest discover -s tests -p "test_*.py"
          python -m py_compile streamlit_app.py src/*.py evaluation/*.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser-test dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium webkit

      - name: Run Streamlit browser test
        run: npm run test:e2e:all
